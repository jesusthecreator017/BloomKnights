services:
  db:
    image: postgres:17-alpine
    container_name: bloomknights-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloom
      POSTGRES_PASSWORD: bloom
      POSTGRES_DB: bloomknights
    ports:
      # host 5433 to avoid clashing with other local postgres containers
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloom -d bloomknights"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
